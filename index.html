<title>Projet XXL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F1F2EF; --surface:#FFFFFF; --surface2:#E7E9E5; --ink:#15171A; --muted:#5B6168; --line:#D5D8D3;
  --d1:#D22B3D; --d2:#1E69C8; --d3:#E9AE00; --d4:#1F8656; --d5:#6B737D;
  --od1:#FFFFFF; --od2:#FFFFFF; --od3:#15171A; --od4:#FFFFFF; --od5:#FFFFFF;
  --ok:#1F8656; --warn:#B86E00; --danger:#C22F3A;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#16181B; --surface:#1E2125; --surface2:#282C31; --ink:#ECEEF0; --muted:#9AA1A9; --line:#30353B;
    --d1:#E03A4C; --d2:#3A82DF; --d3:#F1BC1E; --d4:#2EA26B; --d5:#E4E7EA;
    --od1:#FFFFFF; --od2:#FFFFFF; --od3:#15171A; --od4:#FFFFFF; --od5:#15171A;
    --ok:#3BB57A; --warn:#E5A23A; --danger:#E5525C;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#16181B; --surface:#1E2125; --surface2:#282C31; --ink:#ECEEF0; --muted:#9AA1A9; --line:#30353B;
  --d1:#E03A4C; --d2:#3A82DF; --d3:#F1BC1E; --d4:#2EA26B; --d5:#E4E7EA;
  --od1:#FFFFFF; --od2:#FFFFFF; --od3:#15171A; --od4:#FFFFFF; --od5:#15171A;
  --ok:#3BB57A; --warn:#E5A23A; --danger:#E5525C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.005em;line-height:1.05}
p{margin:0}
main{max-width:640px;margin:0 auto;padding:16px 16px 110px}
main.in-session{padding-bottom:150px}
main.group{padding-bottom:190px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 2px 18px}
.top h1{font-size:40px}
.top .who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--muted)}
.sub{font-size:15px;color:var(--muted)}

.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--c);color:var(--oc);font-family:var(--display);font-weight:700;flex:none;line-height:1}

.next{background:var(--c);color:var(--oc);border-radius:26px;padding:22px 20px 20px;position:relative;overflow:hidden;margin-bottom:22px}
.next .num{position:absolute;right:-6px;top:-34px;white-space:nowrap;font-family:var(--display);font-weight:700;font-size:210px;line-height:1;opacity:.18;pointer-events:none}
.next .k{font-size:15px;font-weight:600;opacity:.85}
.next h2{font-size:44px;margin:6px 0 6px;max-width:80%}
.next .meta{font-size:15px;opacity:.9;margin-bottom:20px}
.btn-plate{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:16px;background:var(--oc);color:var(--c);font-family:var(--display);font-size:24px;font-weight:700}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 10px}
.sec-h h2{font-size:26px}
.sec-h span{font-size:14px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:26px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.wd i{width:100%;aspect-ratio:1;border-radius:50%;background:var(--surface2);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--display);font-weight:700;font-size:17px}
.wd.today i{border-color:var(--ink)}
.wd i.on{background:var(--c);color:var(--oc)}
.crew{display:flex;flex-direction:column;gap:8px;margin-bottom:26px}
.crew-r{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 14px 10px 10px}
.crew-r b{font-weight:600}
.crew-r small{display:block;font-size:14px;color:var(--muted)}
.crew-r .cnt{font-family:var(--display);font-size:22px;font-weight:700}
button.crew-r{width:100%;text-align:left}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);white-space:nowrap}
.pill.up{background:var(--ok);color:#fff}
.pill.warn{background:var(--warn);color:#fff}
.pill.hold{background:var(--d2);color:#fff}

.days{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.day{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:12px 14px 12px 12px;background:var(--surface);border-radius:18px;text-align:left;width:100%}
.disc{width:48px;height:48px;border-radius:50%;background:var(--c);color:var(--oc);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:24px;box-shadow:inset 0 0 0 6px rgba(0,0,0,.08)}
.day b{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1}
.day small{display:block;font-size:14px;color:var(--muted)}
.chev{color:var(--muted)}

#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11.5px;font-weight:600;color:var(--muted)}
#tabs button[aria-current="page"]{color:var(--ink)}
#tabs svg{width:24px;height:24px}
.tabdot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--d1)}

.sh{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin:-16px -16px 14px;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.sh-row{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);flex:none}
.sh-t{flex:1;min-width:0}
.sh-t p{font-size:13px;color:var(--muted);font-weight:600}
.sh-t h1{font-size:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

textarea{width:100%;min-height:74px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:16px;resize:vertical;margin-top:8px}

  const v=variant||"";

const LB = 0.45359237;

const toKg = (v,u)=>u==="kg"? v : v*LB;

const conv = (v,from,to)=>from===to? v : fromKg(toKg(v,from),to);

function exVolume(d){ let v=0; d.sets.forEach(st=>{ if(!st.done) return; st.slots.forEach(sl=>{ const w=num(sl.w), r=num(sl.r); if(w!=null&&r!=null) v+=w*r; }); }); return v; }
function sessVolume(s){ let v=0; Object.values(s.ex||{}).forEach(d=>v+=exVolume(d)); return toKg(v,sUnit(s)); }
const exVolumeKg=(d,u)=>toKg(exVolume(d),u);

function reco(pid, ex, variant, unit){
  const U=unit||"kg", inc=incOf(U);
  const h=exHistory(pid, ex.id, variant);
  if(!h.length) return {k:"info", t:"Première séance sur cet exercice : note ta charge de départ."};
  const last=h[0].d, u0=h[0].u;
  const disp=w=> u0===U? w : roundTo(conv(w,u0,U), U==="kg"?0.5:1);
  if(ex.slots[0].reps==="max"){
    const done=last.sets.filter(x=>x.done), tot=done.reduce((a,x)=>a+(num(x.slots[0].r)||0),0);
    const minR=Math.min(...done.map(x=>num(x.slots[0].r)||0));
    if(done.length>=ex.sets && minR>=12 && !(topWeight(last)>0)) return {k:"up", t:"12 reps ou plus sur chaque série la dernière fois : ajoute du lest."};
    return {k:"info", t:`Dernière fois : ${tot} reps au total. Vise ${tot+1} ou plus.`};
  }
  if(ex.slots[0].reps==null){
    const w0=topWeight(last);
    if(w0==null) return {k:"info", t:"Note tes charges pour suivre ta progression sur cet exercice."};
    const r0=Math.max(0,...last.sets.filter(x=>x.done&&num(x.slots[0].w)===w0).map(x=>num(x.slots[0].r)||0));
    return {k:"info", t:`Dernière fois : ${fmtW(disp(w0),U)}${r0?" × "+r0:""}. Bats-le : une rep de plus ou +${fmtW(inc,U)}.`};
  }
  const wr=topWeight(last), ok=completed(ex,last);
  if(wr==null) return ok? {k:"up", t:"Toutes les reps validées la dernière fois. Ajoute une charge pour progresser."} : {k:"info", t:"Vise toutes les reps prévues."};
  const w=disp(wr);
  if(ok) return {k:"up", t:`Toutes les reps validées à ${fmtW(w,U)} : tente ${fmtW(w+inc,U)}.`};
  if(h.length>=3){ const l3=h.slice(0,3); if(l3.every(x=>topWeight(x.d)===wr&&x.u===u0)&&l3.every(x=>!completed(ex,x.d))){ const nw=Math.max(inc,roundTo(w*.9,inc)); return {k:"warn", t:`3 séances sans valider à ${fmtW(w,U)} : redescends à ${fmtW(nw,U)} et remonte progressivement.`}; } }
  const missed=[]; for(let i=0;i<ex.sets;i++){ const st=last.sets[i]; if(!st||!st.done||slotShort(ex,st)) missed.push(i+1); }
  return {k:"hold", t:`Reste à ${fmtW(w,U)} jusqu’à valider toutes les reps${missed.length? " (manqué : série "+missed.join(", ")+")":""}.`};
}
function nextDayId(){

  const i=days.findIndex(d=>d.id===last.day);

function regularity(p){
  const ss=sessOf(p.id), target=Math.max(1,Math.min(7,daysOf(p.id).length||3)), W=7*864e5;
  const tw=weekStart(Date.now());
  const oldest=ss.reduce((a,s)=>Math.min(a,s.start),Infinity);
  const startW=Math.min(weekStart(p.createdAt||Date.now()), isFinite(oldest)? weekStart(oldest) : Infinity);
  const cnt=w=>ss.filter(s=>s.start>=w&&s.start<w+W).length;
  const thisW=cnt(tw), past=[];
  for(let i=1;i<=4;i++){ const w=tw-i*W; if(w>=startW) past.push(cnt(w)); }
  let streak=0; for(let i=1;i<104;i++){ const w=tw-i*W; if(w<startW||cnt(w)<target) break; streak++; }
  if(thisW>=target) streak++;
  const rate= past.length? Math.min(1, past.reduce((a,b)=>a+b,0)/(past.length*target)) : null;
  const last= isFinite(oldest)? ss.reduce((a,s)=>Math.max(a,s.end||s.start),0) : null;
  let label,k;
  if(rate==null){ label="Nouveau"; k="info"; } else if(rate>=.8){ label="Régulier"; k="up"; } else if(rate>=.5){ label="En rythme"; k="hold"; } else { label="À relancer"; k="warn"; }
  return {target, thisW, rate, streak, last, label, k};
}

function startSession(dayId){

  if(!free&&(!inf||!inf.day.exercises.length)){ toast("Ce jour n’a pas encore d’exercice."); return; }

  if(S.draft){ openSheet(`<h2>Une séance est en cours</h2><p class="sub">${esc(S.draft.dayName)}, commencée il y a ${fmtDur(Date.now()-S.draft.start)}.</p>

function exIdFor(name){
  const k=name.trim().toLowerCase();
  for(const s of sessOf(S.me)) for(const e of (s.defs||[])) if(e.name.trim().toLowerCase()===k) return e.id;
  for(const d of daysOf(S.me)) for(const e of d.exercises) if(e.name.trim().toLowerCase()===k) return e.id;
  const sl=k.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);
  return sl? "f-"+sl : rid("f");
}
function fxSheet(){
  const names=[...new Set([].concat(...sessOf(S.me).map(s=>(s.defs||[]).map(e=>e.name)), ...daysOf(S.me).map(d=>d.exercises.map(e=>e.name))))].slice(0,300);

const defOf = exId=>S.draft.defs.find(e=>e.id===exId);
const variantOf = exId=>(S.draft.ex[exId]&&S.draft.ex[exId].name)||"";
const curName = exId=>variantOf(exId)||defOf(exId).name;
function lastSets(exId){ const h=exHistory(S.me, exId, variantOf(exId)); return h.length? {sets:h[0].d.sets, u:h[0].u} : null; }
function cw(w,u){ const n=num(w), U=sUnit(S.draft); if(n==null||u===U) return String(w); return fmtNum(roundTo(conv(n,u,U), U==="kg"?0.5:1)); }
const phW=(sl,p,u)=>{ const w=p&&p.w; return w!=null&&w!==""? cw(w,u) : (sl.bw?"PDC":"—"); };
const phR=(sl,p)=>{ const r=p&&p.r; return r!=null&&r!==""? String(r) : (sl.reps==="max"?"max":sl.reps==null?"reps":String(sl.reps)); };
function toggleSet(exId,i){
  const ex=defOf(exId), d=S.draft.ex[exId], st=d.sets[i];
  if(!st.done){
    const prev=lastSets(exId), ps=prev&&prev.sets[i];
    st.slots.forEach((sl,j)=>{ const p=ps&&ps.slots[j], def=ex.slots[j];
      if(sl.w===""&&p&&p.w!=="") sl.w=cw(p.w,prev.u);
      if(sl.r===""){ if(p&&p.r!=="") sl.r=p.r; else if(def.reps!=="max"&&def.reps!=null) sl.r=String(def.reps); } });
    st.done=true;
    startRest(restOf(ex), d.sets.every(x=>x.done)? "Repos avant l’exercice suivant" : curName(exId));
  } else st.done=false;
  queueDraft(); refreshCard(exId); refreshProgress();
}

/* ---------- Minuteur ---------- */
let T=null, AC=null;
function unlockAudio(){ try{ if(!AC){ const A=window.AudioContext||window.webkitAudioContext; if(A) AC=new A(); } if(AC&&AC.state==="suspended") AC.resume(); }catch(e){} }
document.addEventListener("touchend",unlockAudio,{passive:true});
document.addEventListener("click",unlockAudio);
function beep(){ if(!AC) return; try{ const t0=AC.currentTime; [0,.28,.56].forEach((d,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=i===2?1175:880; g.gain.setValueAtTime(.0001,t0+d); g.gain.exponentialRampToValueAtTime(.35,t0+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+d+.2); o.connect(g); g.connect(AC.destination); o.start(t0+d); o.stop(t0+d+.22); }); }catch(e){} }
function startRest(sec,label){
  if(!sec) return;
  T={end:Date.now()+sec*1000,total:sec,label,fired:false};
  const el=$("#timer"); el.setAttribute("style",cv(S.draft.dayN));
  el.innerHTML=`<div class="t-in"><div class="t-bar"><i id="tbar"></i></div><div class="t-row">
    <button data-act="t-minus" aria-label="Retirer 15 secondes">−15 s</button>
    <div class="t-mid"><span class="t-label" id="tlabel"></span><span class="t-time" id="ttime"></span></div>
    <button data-act="t-plus" aria-label="Ajouter 15 secondes">+15 s</button>
    <button data-act="t-skip" class="t-skip" id="tskip">Passer</button></div></div>`;
  el.className="on"; tickTimer();
}
function stopRest(){ T=null; const el=$("#timer"); el.className=""; el.innerHTML=""; }
function tickTimer(){
  if(!T) return;
  const left=(T.end-Date.now())/1000;
  if(left<=0&&!T.fired){ T.fired=true; T.doneAt=Date.now(); beep(); try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} $("#timer").classList.add("go"); }
  if(T.fired&&Date.now()-T.doneAt>5000){ stopRest(); return; }
  const tt=$("#ttime"), tl=$("#tlabel"), tb=$("#tbar"), ts=$("#tskip");
  if(tt) tt.textContent=T.fired? "C’est reparti" : fmtClock(Math.ceil(left));
  if(tl) tl.textContent=T.fired? "Repos terminé" : T.label;
  if(tb) tb.style.width=T.fired? "0%" : Math.max(0,Math.min(100,left/T.total*100))+"%";
  if(ts) ts.textContent=T.fired? "OK" : "Passer";
}
let WL=null;
async function wakeLock(on){ try{ if(on&&navigator.wakeLock&&!WL){ WL=await navigator.wakeLock.request("screen"); WL.addEventListener("release",()=>{WL=null;}); } if(!on&&WL){ await WL.release(); WL=null; } }catch(e){} }

/* ---------- Photos du groupe (24 h) ---------- */
function fileToImg(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }
function canvasOf(img,max){ const w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,max/Math.max(w,h)); const c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c; }
async function compressForDb(file){
  const img=await fileToImg(file); let max=1080, q=.72, out="";
  for(let k=0;k<7;k++){ out=canvasOf(img,max).toDataURL("image/jpeg",q); if(out.length<190000) return out; max=Math.round(max*.85); q=Math.max(.5,q-.05); }
  return out.length<240000? out : null;
}
async function postPhoto(dataUrl, caption){
  const id=rid("ph"), now=Date.now(), exp=now+864e5;
  S.photoCache[id]=dataUrl;
  await enqueue("photos/"+id, ()=>DB.doc("photos/"+id).set({data:dataUrl, pid:S.me, createdAt:now, expiresAt:exp}));
  await enqueue("feed/"+id, ()=>DB.doc("feed/"+id).set({kind:"photo", pid:S.me, createdAt:now, expiresAt:exp, caption:caption||""}));
}
function photoSrc(id){
  const c=S.photoCache[id];
  if(c===undefined){ S.photoCache[id]="loading"; DB.doc("photos/"+id).get().then(d=>{ S.photoCache[id]= d.exists&&d.data().data? d.data().data : "missing"; liveRender(); }).catch(()=>{ delete S.photoCache[id]; }); return null; }
  return c==="loading"||c==="missing"? null : c;
}
const cleaned=new Set();
function cleanupExpired(){
  if(!DB) return; const now=Date.now();
  S.feed.forEach(p=>{
    if(p.kind!=="photo"||!(p.expiresAt<now)||cleaned.has(p.id)) return;
    if(p.pid!==S.me) return;
    cleaned.add(p.id);
    DB.doc("photos/"+p.id).delete().then(()=>DB.doc("feed/"+p.id).delete()).catch(()=>cleaned.delete(p.id));
  });
}
const livePhotos = ()=>S.feed.filter(p=>p.kind==="photo"&&p.expiresAt>Date.now()).sort((a,b)=>b.createdAt-a.createdAt);

function unread(){ const seen=+(lsGet("mt:seen")||0); return S.feed.some(p=>p.pid!==S.me&&p.createdAt>seen&&(p.kind!=="photo"||p.expiresAt>Date.now())); }

async function saveSession(){
  flushDraft();
  const s=clone(S.draft); s.end=Date.now(); s.pid=S.me;
  const photo=S.finPhoto;
  S.draft=null; S.inSession=false; S.finPhoto=null; stopRest(); wakeLock(false); closeSheet();
  S.sessions[S.me]=[s, ...sessOf(S.me).filter(x=>x.id!==s.id)];
  enqueue(`profiles/${S.me}/sessions/${s.id}`, ()=>DB.doc(`profiles/${S.me}/sessions/${s.id}`).set(s)).catch(()=>{});
  saveDraftNow();
  const ev={kind:"session", pid:S.me, createdAt:Date.now(), dayName:s.dayName, dayN:s.dayN, sets:sessSets(s), volumeKg:Math.round(sessVolume(s)), dur:s.end-s.start};
  enqueue("feed/"+s.id, ()=>DB.doc("feed/"+s.id).set(ev)).catch(()=>{});
  if(photo) postPhoto(photo, s.dayName).catch(()=>{});
  S.tab="group"; render(); window.scrollTo(0,document.documentElement.scrollHeight); toast("Séance enregistrée");
}

  const photos=livePhotos();
  const strip=`<div class="strip">
    <label class="story add"><span class="im">${ICON.cam}Ta photo du jour<input type="file" accept="image/*" id="storyin"></span><small>Visible 24 h</small></label>
    ${photos.map(p=>{ const pr=profOf(p.pid), src=photoSrc(p.id), h=Math.max(1,Math.ceil((p.expiresAt-Date.now())/3600000));
      return `<button class="story" data-act="photo" data-id="${esc(p.id)}"><span class="im">${src?`<img src="${src}" alt="">`:""}<span class="left">${h} h</span>${av(pr,28)}</span><b>${esc(pr?pr.name:"Ancien membre")}</b><small>${esc(p.caption||relTime(p.createdAt))}</small></button>`; }).join("")}
  </div>`;
  const items=S.feed.filter(p=>p.kind!=="photo").sort((a,b)=>a.createdAt-b.createdAt);
  let lastDay="", tl="";
  items.forEach(p=>{
    const dk=new Date(p.createdAt).toDateString();
    if(dk!==lastDay){ lastDay=dk; tl+=`<p class="tl-day">${cap(dFmt.format(p.createdAt))}</p>`; }
    const pr=profOf(p.pid), nm=esc(pr?pr.name:"Ancien membre"), t=new Date(p.createdAt).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});

    else if(p.kind==="session") tl+=`<div class="msg">${av(pr,34)}<div><p class="who">${nm}<time>${t}</time></p><div class="ev" style="${cv(p.dayN)}"><small>Séance terminée</small><b>${esc(p.dayName)}</b><small>${plural(p.sets||0,"série")}${(p.volumeKg!=null||p.volume)? ", "+fmtBig(p.volumeKg!=null? p.volumeKg : p.volume*LB)+" kg":""}${p.dur? ", "+fmtDur(p.dur):""}</small></div></div></div>`;

  return `<header class="top"><h1>Groupe</h1><span class="sub">${plural(Object.keys(S.profiles).length,"membre")}</span></header>${strip}

function lineChart(pts, color, unit){
  if(pts.length<2) return `<p class="sub" style="margin:8px 0 0">Il faut au moins deux séances pour tracer la courbe.</p>`;
  const W=340,H=160,pl=40,pr=10,pt=12,pb=24, ys=pts.map(p=>p.y); let mn=Math.min(...ys), mx=Math.max(...ys);
  if(mn===mx){ mn-=1; mx+=1; } const pad=(mx-mn)*.15; mn-=pad; mx+=pad;
  const X=i=>pl+(W-pl-pr)*(i/(pts.length-1)), Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const grid=[0,.5,1].map(f=>{ const v=mn+(mx-mn)*f, y=Y(v); return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v>=1000?fmtNum(v/1000)+"k":fmtNum(v)}</text>`; }).join("");
  const path=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution en ${unit}">${grid}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===pts.length-1?4.5:3}" fill="${color}"/>`).join("")}<text x="${pl}" y="${H-6}">${esc(pts[0].label)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${esc(pts[pts.length-1].label)}</text></svg>`;
}
function barChart(pts, color, fmt, ref){
  const W=340,H=150,pl=10,pr=10,pt=18,pb=24, mx=Math.max(ref||0,...pts.map(p=>p.y),1), bw=(W-pl-pr)/pts.length;
  const bars=pts.map((p,i)=>{ const h=(H-pt-pb)*(p.y/mx), x=pl+i*bw+bw*.18, w=bw*.64, y=H-pb-h;
    return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,p.y?2:0)}" rx="4" fill="${color}" opacity="${i===pts.length-1?1:.55}"/>${p.y?`<text x="${x+w/2}" y="${y-5}" text-anchor="middle">${fmt(p.y)}</text>`:""}<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(p.label)}</text>`; }).join("");
  const ry=H-pb-(H-pt-pb)*((ref||0)/mx);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${ref?`<line x1="${pl}" x2="${W-pr}" y1="${ry}" y2="${ry}" stroke="var(--line)" stroke-dasharray="4 4"/>`:""}${bars}</svg>`;
}
function progressHTML(){
  const pid=vpid(), p=profOf(pid), ss=sessOf(pid), days=daysOf(pid);
  if(!ss.length) return `<header class="top"><h1>Progrès</h1></header>${chipsHTML()}<div class="empty"><b>Pas encore de données</b>${pid===S.me?"Tes courbes apparaîtront après ta première séance.":esc(p.name)+" n’a encore rien enregistré."}</div>`;
  const tw=weekStart(Date.now()), weeks=Array.from({length:8},(_,i)=>tw-(7-i)*7*864e5);
  const wk=weeks.map(w=>{ const l=ss.filter(s=>s.start>=w&&s.start<w+7*864e5); return {label:dShort.format(w).replace(".",""), n:l.length, v:l.reduce((a,s)=>a+sessVolume(s),0)}; });
  const avg=wk.slice(-4).reduce((a,w)=>a+w.n,0)/4;
  const exs=[]; days.forEach((d,i)=>d.exercises.forEach(e=>exs.push({e,d,i})));
  const freeD={name:"Séances libres", exercises:[]}, seenF=new Set(exs.map(x=>x.e.id));
  ss.forEach(s=>(s.defs||[]).forEach(e=>{ if((s.day==="free"||e.added) && !seenF.has(e.id)){ seenF.add(e.id); freeD.exercises.push(e); exs.push({e, d:freeD, i:4}); } }));
  const withH=exs.filter(x=>exHistory(pid,x.e.id,"").length);
  if(!S.progEx || !exs.some(x=>x.e.id===S.progEx)) S.progEx= withH.length? withH[0].e.id : (exs[0]&&exs[0].e.id);
  const cur=exs.find(x=>x.e.id===S.progEx);
  let exCard="";
  if(cur){
    const ex=cur.e, h=exHistory(pid,ex.id,"").reverse(), isMax=ex.slots[0].reps==="max";
    const lab=x=>dShort.format(x.s.start).replace(".","");
    const ptsW=isMax? h.map(x=>({label:lab(x), y:x.d.sets.filter(s=>s.done).reduce((a,s)=>a+(num(s.slots[0].r)||0),0)})) : h.map(x=>{ const t=topWeight(x.d); return {label:lab(x), y:t==null?null:toKg(t,x.u)}; }).filter(q=>q.y!=null);
    const ptsV=h.map(x=>({label:lab(x), y:exVolumeKg(x.d,x.u)})).filter(q=>q.y>0);
    let best=null; h.forEach(x=>x.d.sets.forEach(st=>{ if(!st.done) return; const wr=num(st.slots[0].w), w=wr==null?null:toKg(wr,x.u), r=num(st.slots[0].r); if(w!=null&&(!best||w>best.w||(w===best.w&&(r||0)>(best.r||0)))) best={w,r,t:x.s.start}; }));
    const r=reco(pid,ex,"","kg");
    const opts=[...days, ...(freeD.exercises.length?[freeD]:[])].map((d,i)=>`<optgroup label="${d===freeD? esc(d.name) : "Jour "+(i+1)+", "+esc(d.name)}">${d.exercises.map(e=>`<option value="${esc(e.id)}" ${e.id===ex.id?"selected":""}>${esc(e.name)}${exHistory(pid,e.id,"").length?"":" (aucune donnée)"}</option>`).join("")}</optgroup>`).join("");
    exCard=`<div class="sec-h" style="margin-top:18px"><h2>Par exercice</h2></div><select id="exsel" aria-label="Choisir un exercice">${opts}</select>
      <div class="card" style="${cv(dn(cur.i))}"><h3>${esc(ex.name)}</h3>
      <p class="sub">${best&&!isMax? "Record : "+fmtKg(best.w)+(best.r?" × "+best.r:"")+" le "+dShort.format(best.t) : (h.length? plural(h.length,"séance") : "Aucune séance sur cet exercice")}</p>
      ${h.length?`<p class="reco ${r.k}" style="margin:0 0 12px">${ICON[r.k]}<span>${esc(r.t)}</span></p><p class="sub" style="margin-bottom:4px">${isMax?"Reps totales par séance":"Charge max par séance (kg)"}</p>${lineChart(ptsW,"var(--c)",isMax?"reps":"kg")}`:""}
      ${ptsV.length?`<p class="sub" style="margin:14px 0 4px">Volume par séance (kg)</p>${lineChart(ptsV,"var(--c)","kg")}`:""}</div>`;
  }
  return `<header class="top"><h1>Progrès</h1></header>${chipsHTML()}
    ${startKg(p)!=null?`<p class="sub" style="margin:0 2px 10px">Poids de départ : ${fmtKg(startKg(p))}</p>`:""}<div class="stats"><div class="stat"><b>${ss.length}</b><small>séances au total</small></div><div class="stat"><b>${fmtNum(avg)}</b><small>par semaine (4 dernières)</small></div><div class="stat"><b>${fmtNum(wk[7].v/1000)} t</b><small>soulevées cette semaine</small></div></div>
    <div class="card"><h3>Séances par semaine</h3><p class="sub">Ligne pointillée : ${days.length||3} par semaine</p>${barChart(wk.map(w=>({label:w.label,y:w.n})),"var(--d2)",v=>v,days.length||3)}</div>
    <div class="card"><h3>Volume par semaine</h3><p class="sub">Tonnes soulevées (charge × reps), toutes unités converties en kg</p>${barChart(wk.map(w=>({label:w.label,y:w.v/1000})),"var(--d4)",v=>fmtNum(v)+" t")}</div>${exCard}`;
}

function saveExEditor(){
  const r=S.edit.raw, name=r.name.trim();
  if(!name){ toast("Donne un nom à l’exercice."); return; }
  const sets=parseInt(r.sets,10); if(!(sets>=1&&sets<=20)){ toast("Indique entre 1 et 20 séries."); return; }
  const rest=parseInt(r.rest||"0",10); if(!(rest>=0&&rest<=900)){ toast("Indique un repos entre 0 et 900 secondes."); return; }
  const slots=[];
  for(let k=0;k<r.parts.length;k++){ const p=r.parts[k], rv=p.reps.trim().toLowerCase();
    const reps= rv==="max"? "max" : parseInt(rv,10);
    if(reps!=="max" && !(reps>=1&&reps<=500)){ toast("Reps invalides : un nombre ou « max »."); return; }
    const s={reps}; if(r.parts.length>1) s.label=(p.label.trim()||"Partie "+(k+1)); else if(p.label.trim()) s.label=p.label.trim(); if(p.bw) s.bw=true; slots.push(s); }
  const tags=r.tags.split(",").map(t=>t.trim()).filter(Boolean).slice(0,4);
  const {dayId,k}=S.edit;
  mutDays(days=>{ const d=findMyDay(days,dayId); if(!d) return;
    const base= k==null? {id:rid("e")} : d.exercises[k];
    const e={id:base.id, name, sets, rest, slots}; if(tags.length) e.tags=tags; if(r.note.trim()) e.note=r.note.trim();
    if(k==null) d.exercises.push(e); else d.exercises[k]=e; });
  S.edit=null; closeSheet(); render(); toast("Programme mis à jour");
}

/* Import de programme par photos */
const IMPORT_PROMPT = `Les images sont des captures d’écran ou photos d’un programme de musculation, réparti par jours. Elles peuvent se chevaucher (captures successives d’un même tableau) : ne duplique aucun exercice.
Réponds uniquement avec un objet JSON de cette forme :
{"days":[{"name":"Pecs / Biceps","exercises":[{"name":"Développé couché","sets":4,"rest":90,"parts":[{"label":"","reps":12,"bodyweight":false}],"tags":[],"note":""}]}]}
Règles :
- "name" du jour : les groupes musculaires ou le titre du jour, sans « Jour 1 ».
- "rest" en secondes (1min30 = 90, 45sec = 45). Absent : 90.
- "sets" : nombre de séries. Absent : 3.
- "reps" : un nombre, ou "max" pour un maximum de répétitions.
- Dropset écrit 12 X 12 X 12 : trois parts, labels "Charge 1", "Drop 1", "Drop 2". « 8 reps dropset 8 reps » : deux parts, "Série" et "Dropset". Tag "Dropset".
- Deux mouvements enchaînés ou en superset : une part par mouvement, label = nom du mouvement. Tag "Superset" ou "Enchaîné".
- "bodyweight" vrai pour pompes, dips sur banc, tractions sans lest.
- Tags possibles : Dropset, Superset, Enchaîné, Jambe par jambe, Lourd, Finisher, Max de reps.
- "note" : toute consigne particulière (ex. « à la fin des séries, 50 pompes »), sinon "".
- Noms d’exercices en français, corrige l’orthographe évidente.`;
async function importProgram(files){
  if(!SAMPLE){ toast("La lecture de photos n’est pas disponible ici."); return; }
  let lim=null; try{ lim=await SAMPLE.limits(); }catch(e){}
  if(!lim||!lim.images){ toast("La lecture de photos n’est pas disponible ici."); return; }
  const blobs=[];
  for(const f of files.slice(0,lim.images.maxCount)){ try{ const img=await fileToImg(f); blobs.push(await new Promise(r=>canvasOf(img,1800).toBlob(r,"image/jpeg",.88))); }catch(e){} }
  if(!blobs.length){ toast("Impossible de lire ces images."); return; }
  const ctl=new AbortController(); S.imp={ctl};
  openSheet(`<h2>Lecture du programme</h2><p class="sub">Claude lit tes ${plural(blobs.length,"image")}. Ça peut prendre jusqu’à une minute.</p><div class="spin"></div><button class="btn sec" data-act="imp-stop">Arrêter</button>`);
  try{
    const res=await SAMPLE.json(IMPORT_PROMPT,{images:blobs, signal:ctl.signal, cache:false});
    const days=normalizeProgram(res);
    if(!days.length){ openSheet(`<h2>Rien de lisible</h2><p class="sub">Aucun exercice n’a été reconnu. Essaie avec des captures plus nettes, ou ajoute tes jours à la main.</p><button class="btn sec" data-act="sheet-close">Fermer</button>`); return; }
    S.imp={days};
    const had=daysOf(S.me).length;
    openSheet(`<h2>Programme lu</h2><p class="sub">${plural(days.length,"jour")}, ${plural(days.reduce((a,d)=>a+d.exercises.length,0),"exercice")}. Vérifie, tu pourras tout corriger ensuite.</p>
      ${days.map((d,i)=>`<div class="det-ex" style="border-top:5px solid var(--d${dn(i)})"><b>Jour ${i+1} : ${esc(d.name)}</b><ol>${d.exercises.map(e=>`<li>${esc(e.name)} : ${exLine(e)}</li>`).join("")}</ol></div>`).join("")}
      <button class="btn pri" data-act="imp-use">${had?"Remplacer mon programme":"Utiliser ce programme"}</button>${had?`<p class="sub" style="margin-top:6px">Ton historique de séances est conservé.</p>`:""}
      <button class="btn sec" data-act="sheet-close">Annuler</button>`);
  }catch(e){
    if(e&&e.code==="cancelled"){ closeSheet(); return; }
    const msg={not_granted:"Tu as refusé l’accès à Claude pour cette app.", rate_limited:"Limite d’utilisation atteinte. Réessaie plus tard.", image_rejected:"Une image n’a pas été acceptée. Essaie une autre capture.", invalid_json:"La lecture a échoué. Réessaie.", refused:"Claude n’a pas pu lire ces images."}[e&&e.code]||"La lecture a échoué. Réessaie dans un instant.";
    openSheet(`<h2>Lecture impossible</h2><p class="sub">${esc(msg)}</p><button class="btn sec" data-act="sheet-close">Fermer</button>`);
  }
}
function normalizeProgram(res){
  const days=(res&&Array.isArray(res.days))? res.days : [];
  return days.slice(0,7).map((d,i)=>({id:rid("d"), name:String(d&&d.name||("Jour "+(i+1))).slice(0,60), exercises:(Array.isArray(d&&d.exercises)?d.exercises:[]).slice(0,25).map(normEx).filter(Boolean)})).filter(d=>d.exercises.length);
}
function normEx(e){
  if(!e||!e.name) return null;
  const sets=Math.max(1,Math.min(20,parseInt(e.sets,10)||3));
  const rr=parseInt(e.rest,10), rest=isFinite(rr)? Math.max(0,Math.min(900,rr)) : 90;
  const parts=Array.isArray(e.parts)&&e.parts.length? e.parts.slice(0,4) : [{reps:e.reps}];
  const slots=parts.map((p,k)=>{ const rv=String(p&&p.reps!=null?p.reps:"").toLowerCase().trim(); const s={reps: rv==="max"? "max" : Math.max(1,Math.min(500,parseInt(rv,10)||10))};
    const lab=String(p&&p.label||"").trim(); if(parts.length>1) s.label=(lab||"Partie "+(k+1)).slice(0,40); if(p&&p.bodyweight===true) s.bw=true; return s; });
  const out={id:rid("e"), name:String(e.name).slice(0,80), sets, rest, slots};
  const tags=(Array.isArray(e.tags)?e.tags:[]).map(t=>String(t).trim().slice(0,24)).filter(Boolean).slice(0,4); if(tags.length) out.tags=tags;
  if(e.note&&String(e.note).trim()) out.note=String(e.note).trim().slice(0,200);
  return out;
}

    case "copy-ex": { const d=daysOf(ds.pid).find(x=>x.id===ds.day), ex=d&&d.exercises[+ds.k]; if(!ex) break; S.copyEx=clone(ex);
      const mine=daysOf(S.me);
      openSheet(`<h2>Ajouter « ${esc(ex.name)} »</h2><p class="sub">Dans quel jour de ton programme ?</p>${mine.map((m,i)=>`<button class="day" style="${cv(dn(i))};margin-bottom:8px" data-act="copy-to" data-day="${esc(m.id)}"><span class="disc">${i+1}</span><span><b>${esc(m.name)}</b><small>${plural(m.exercises.length,"exercice")}</small></span><span class="chev">${ICON.chev}</span></button>`).join("")}<button class="btn sec" data-act="copy-new">${ICON.plus}Dans un nouveau jour</button>`); break; }
    case "copy-to": { const ex=S.copyEx; if(!ex) break; mutDays(days=>{ const d=findMyDay(days,ds.day); if(d) d.exercises.push(copyEx(ex)); }); closeSheet(); toast("Exercice ajouté"); break; }
    case "copy-new": { const ex=S.copyEx; if(!ex) break; mutDays(days=>days.push({id:rid("d"), name:"Nouveau jour", exercises:[copyEx(ex)]})); closeSheet(); toast("Exercice ajouté dans un nouveau jour"); break; }
    case "day-new": mutDays(days=>days.push({id:rid("d"), name:"Jour "+(days.length+1), exercises:[]})); render(); break;
    case "day-rename": { const d=findMyDay(daysOf(S.me),ds.day); openSheet(`<h2>Renommer le jour</h2><label class="field" style="margin-top:12px"><span>Nom</span><input type="text" id="dayname" value="${esc(d.name)}" maxlength="60"></label><button class="btn pri" data-act="day-rename-ok" data-day="${esc(ds.day)}">Enregistrer</button>`); const i=$("#dayname"); if(i) i.focus(); break; }
    case "day-rename-ok": { const v=($("#dayname").value||"").trim().slice(0,60); if(!v){ toast("Donne un nom au jour."); break; } mutDays(days=>{ const d=findMyDay(days,ds.day); if(d) d.name=v; }); closeSheet(); render(); break; }
    case "day-up": mutDays(days=>{ const i=days.findIndex(d=>d.id===ds.day); if(i>0){ const [x]=days.splice(i,1); days.splice(i-1,0,x); } }); render(); break;
    case "day-del": if(!arm(b,"Confirmer la suppression du jour")) break; mutDays(days=>{ const i=days.findIndex(d=>d.id===ds.day); if(i>=0) days.splice(i,1); }); render(); break;
    case "ex-up": case "ex-down": mutDays(days=>{ const d=findMyDay(days,ds.day), k=+ds.k, j=a==="ex-up"?k-1:k+1; if(d&&j>=0&&j<d.exercises.length){ const t=d.exercises[k]; d.exercises[k]=d.exercises[j]; d.exercises[j]=t; } }); render(); break;
    case "ex-edit": openExEditor(ds.day,+ds.k); break;
    case "ex-new": openExEditor(ds.day,null); break;
    case "part-add": S.edit.raw.parts.push({label:"",reps:"12",bw:false}); renderExEditor(); break;
    case "part-del": S.edit.raw.parts.splice(+ds.k,1); renderExEditor(); break;
    case "ex-save": saveExEditor(); break;
    case "ex-del": { if(!arm(b,"Confirmer la suppression")) break; const {dayId,k}=S.edit; mutDays(days=>{ const d=findMyDay(days,dayId); if(d) d.exercises.splice(k,1); }); closeSheet(); render(); break; }
    case "imp-stop": closeSheet(); break;
    case "imp-use": { const days=S.imp&&S.imp.days; if(!days) break; mutDays(d=>{ d.splice(0,d.length,...days); }); S.imp=null; closeSheet(); render(); window.scrollTo(0,0); toast("Programme importé"); break; }
  }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.classList.contains("in")&&S.draft){ S.draft.ex[t.dataset.ex].sets[+t.dataset.i].slots[+t.dataset.j][t.dataset.f]=t.value.trim(); queueDraft(); }
  else if(t.classList.contains("ex-note")&&S.draft){ S.draft.ex[t.dataset.ex].note=t.value; queueDraft(); }
  else if(t.id==="sess-note"&&S.draft){ S.draft.note=t.value; queueDraft(); }
  else if(t.id==="onb-name"){ S.onb.name=t.value; }
  else if(t.id==="au-email"){ S.auth.email=t.value; }
  else if(t.id==="au-pw"){ S.auth.pw=t.value; }
  else if(t.id==="onb-weight"){ S.onb.weight=t.value; }
  else if(S.edit&&t.dataset.ef){ S.edit.raw[t.dataset.ef]=t.value; }
  else if(S.edit&&t.dataset.pf){ const p=S.edit.raw.parts[+t.dataset.k]; if(p) p[t.dataset.pf]= t.type==="checkbox"? t.checked : t.value; }
});
document.addEventListener("change", async e=>{
  const t=e.target;
  if(t.name==="onbc"){ S.onb.choice=t.value; }
  else if(t.name==="onbu"){ S.onb.unit=t.value; }
  else if(t.name==="meu"){ const i=$("#me-weight"), n=num(i.value); if(n!=null&&i.dataset.u!==t.value) i.value=fmtNum(conv(n,i.dataset.u,t.value)); i.dataset.u=t.value; }
  else if(t.id==="exsel"){ S.progEx=t.value; render(); }
  else if(S.edit&&t.dataset.pf==="bw"){ const p=S.edit.raw.parts[+t.dataset.k]; if(p) p.bw=t.checked; }
  else if(t.id==="impin"&&t.files&&t.files.length){ const f=[...t.files]; t.value=""; importProgram(f); }
  else if((t.id==="storyin"||t.id==="camin")&&t.files&&t.files[0]){ const f=t.files[0]; t.value=""; toast("Envoi de la photo…");
    try{ const d=await compressForDb(f); if(!d){ toast("Photo trop lourde, essaie une autre."); return; } await postPhoto(d,""); render(); toast("Photo partagée pour 24 h"); }catch(err){ toast("Envoi impossible."); } }
  else if(t.id==="finin"&&t.files&&t.files[0]){ const f=t.files[0]; t.value="";
    try{ const d=await compressForDb(f); if(!d){ toast("Photo trop lourde, essaie une autre."); return; } S.finPhoto=d; finishSheet(); }catch(err){ toast("Photo illisible."); } }
});
document.addEventListener("keydown", e=>{
  const t=e.target; if(e.key!=="Enter") return;
  if(t.classList&&t.classList.contains("rn")){ e.preventDefault(); applyRename(t.dataset.ex); }
  else if(t.id==="msgin"){ e.preventDefault(); sendMsg(); }
  else if(t.id==="au-pw"){ e.preventDefault(); doAuth("login"); }
});

render();
boot();
})();
</script>
</body>
</html>
